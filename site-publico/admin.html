<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RT Car — Admin do banner</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<style>
:root{--bg:#f6f5f3;--bg2:#fff;--tx:#1a1814;--tx2:#4a4a4a;--tx3:#8a8580;--red:#e8431e;--redl:#fff0ec;--bdr:#e6e3de;--r:10px;--r2:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);padding:32px;width:100%;max-width:480px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
h1{font-size:18px;margin-bottom:4px}
.sub{font-size:12px;color:var(--tx3);margin-bottom:20px}
.field{margin-bottom:12px}
.field input{width:100%;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:var(--r);font-size:13px;font-family:inherit}
.field input:focus{outline:none;border-color:var(--red)}
.btn{background:var(--red);color:#fff;border:none;padding:10px 18px;border-radius:var(--r);font-weight:700;font-size:13px;cursor:pointer;width:100%}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.erro{background:var(--redl);color:var(--red);padding:9px 12px;border-radius:var(--r);font-size:12px;margin-bottom:12px;display:none}
.hidden{display:none!important}
.upload-area{border:2px dashed var(--bdr);border-radius:var(--r);padding:24px;text-align:center;color:var(--tx3);font-size:13px;cursor:pointer;margin-bottom:18px}
.upload-area:hover{border-color:var(--red);color:var(--red)}
.lista-banner{display:flex;flex-direction:column;gap:10px}
.banner-item{display:flex;align-items:center;gap:12px;border:1px solid var(--bdr);border-radius:var(--r);padding:8px;background:var(--bg)}
.banner-item img{width:90px;height:56px;object-fit:cover;border-radius:6px;flex-shrink:0}
.banner-item .nome{flex:1;font-size:11px;color:var(--tx3);word-break:break-all}
.banner-item button{background:none;border:1.5px solid var(--bdr);color:var(--tx2);padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer}
.banner-item button:hover{border-color:var(--red);color:var(--red)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sair{font-size:12px;color:var(--tx3);cursor:pointer}
.sair:hover{color:var(--red)}
</style>
</head>
<body>
<div class="box">
  <div id="login-view">
    <h1>Admin do site</h1>
    <div class="sub">Entre com o mesmo login do CRM pra gerenciar o banner.</div>
    <div class="erro" id="erro-login"></div>
    <div class="field"><input type="email" id="f-email" placeholder="E-mail"></div>
    <div class="field"><input type="password" id="f-senha" placeholder="Senha"></div>
    <button class="btn" id="btn-login">Entrar</button>
  </div>

  <div id="app-view" class="hidden">
    <div class="top">
      <h1>Banner do site</h1>
      <span class="sair" id="btn-sair">Sair</span>
    </div>
    <div class="sub">As fotos aqui aparecem passando no topo do site público, na ordem de envio.</div>
    <input type="file" id="f-arquivo" accept="image/*" multiple class="hidden">
    <div class="upload-area" id="upload-area">📷 Clique ou arraste fotos aqui pra adicionar ao banner</div>
    <div class="lista-banner" id="lista-banner"></div>
  </div>
</div>

<script>
const FB = { projectId: 'rtcarprograma', apiKey: 'AIzaSyAHswK1g0CnOJYiN3smElfDL1XQFrOR-Y8' };
firebase.initializeApp({ apiKey: FB.apiKey, authDomain: `${FB.projectId}.firebaseapp.com`, projectId: FB.projectId, storageBucket: `${FB.projectId}.firebasestorage.app` });
const auth = firebase.auth();
const storage = firebase.storage();
const bannersRef = storage.ref('banners');

function mostrarErro(msg){ const el=document.getElementById('erro-login'); el.textContent=msg; el.style.display='block'; }

document.getElementById('btn-login').onclick = async () => {
  const email = document.getElementById('f-email').value.trim();
  const senha = document.getElementById('f-senha').value;
  document.getElementById('erro-login').style.display = 'none';
  try {
    await auth.signInWithEmailAndPassword(email, senha);
  } catch (e) {
    mostrarErro('Login ou senha incorretos.');
  }
};
document.getElementById('btn-sair').onclick = () => auth.signOut();

document.getElementById('upload-area').onclick = () => document.getElementById('f-arquivo').click();
document.getElementById('f-arquivo').onchange = async (e) => {
  const arquivos = Array.from(e.target.files);
  for (const arquivo of arquivos) {
    const nome = `${Date.now()}-${arquivo.name}`;
    await bannersRef.child(nome).put(arquivo);
  }
  e.target.value = '';
  carregarBanners();
};

async function carregarBanners(){
  const lista = document.getElementById('lista-banner');
  lista.innerHTML = '<div style="font-size:12px;color:#8a8580">Carregando...</div>';
  const res = await bannersRef.listAll();
  const itens = await Promise.all(res.items.map(async (item) => ({ item, url: await item.getDownloadURL() })));
  if (!itens.length) { lista.innerHTML = '<div style="font-size:12px;color:#8a8580">Nenhuma foto no banner ainda.</div>'; return; }
  lista.innerHTML = itens.map(({ item, url }) => `
    <div class="banner-item">
      <img src="${url}">
      <div class="nome">${item.name}</div>
      <button onclick="excluirBanner('${item.fullPath}')">Excluir</button>
    </div>`).join('');
}
async function excluirBanner(caminho){
  if (!confirm('Remover essa foto do banner?')) return;
  await storage.ref(caminho).delete();
  carregarBanners();
}

auth.onAuthStateChanged((user) => {
  document.getElementById('login-view').classList.toggle('hidden', !!user);
  document.getElementById('app-view').classList.toggle('hidden', !user);
  if (user) carregarBanners();
});
</script>
</body>
</html>
